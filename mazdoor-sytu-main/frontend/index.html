<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mazdoor Sytu – India's unified skilled workforce platform. Book verified electricians, plumbers, carpenters and more. Find jobs, post requirements, and grow your business." />
    <title>Mazdoor Sytu | Trusted Skilled Workforce &amp; Service Platform</title>

    <!-- Preload critical brand logo (WebP) to avoid LCP delay -->
    <link rel="preload" as="image" href="/official-logo.webp" type="image/webp" fetchpriority="high" />

    <!-- Preconnect to font origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload font stylesheet (non-blocking) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Cormorant+Garamond:wght@500;600;700&display=swap" />

    <!-- Load fonts asynchronously - zero render blocking -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Cormorant+Garamond:wght@500;600;700&display=swap"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Cormorant+Garamond:wght@500;600;700&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
